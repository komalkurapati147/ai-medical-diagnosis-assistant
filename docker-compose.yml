version: "3.9"

services:
  api:
    build: .
    container_name: medical_diagnosis_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/medical_diagnosis
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./generated_reports:/code/generated_reports

  db:
    image: postgres:16-alpine
    container_name: medical_diagnosis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medical_diagnosis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
