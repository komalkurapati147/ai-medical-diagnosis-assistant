# Render.com blueprint — deploy via "New + Blueprint" pointing at this repo.
services:
  - type: web
    name: ai-medical-diagnosis-api
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medical-diagnosis-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
    healthCheckPath: /health

databases:
  - name: medical-diagnosis-db
    plan: free
    databaseName: medical_diagnosis
    user: medical_admin
